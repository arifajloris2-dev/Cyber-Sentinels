# Credential theft: dumping LSASS memory and Kerberoasting.
rules:
  - id: CRED-001
    type: match
    short: credential theft (LSASS opened)
    title: A process opened LSASS memory (credential dumping)
    attack: [T1003.001]
    severity: 9
    where:
      type: process
      action: process-access
      target|re: ["(?i)\\\\lsass\\.exe$"]
      granted|re: ["(?i)^0x(1fffff|1f3fff|1010|1410|1438|143a|1fffff)$"]
    text: "{path} opened {target} with access {granted} on {host} as {user} at {first}"

  - id: CRED-002
    type: match
    short: credential dumping command
    title: Credential dumping command (comsvcs MiniDump, procdump on lsass, mimikatz)
    attack: [T1003.001]
    severity: 9
    where:
      type: process
      action: process-start
      detail|re: ["(?i)comsvcs(\\.dll)?[ ,]+#?(minidump|24)\\b", "(?i)procdump.*\\blsass", "(?i)sekurlsa::|lsadump::"]
    text: "Credential dumping on {host} by {user} at {first}: {detail}"

  - id: CRED-003
    type: distinct_threshold
    short: Kerberoasting
    title: Many weak (RC4) Kerberos service tickets for different service accounts (Kerberoasting)
    attack: [T1558.003]
    severity: 8
    group_by: [src_ip]
    distinct_by: [service]
    window_min: 10
    min_distinct: 3
    where: {type: auth, action: kerberos-service-ticket, ticket_enc: "0x17", service|re: ["[^$]$"]}
    text: "{distinct_source_count} RC4 service tickets for different service accounts requested by {user} from {src_ip} ({src_host}) between {first} and {last}"
