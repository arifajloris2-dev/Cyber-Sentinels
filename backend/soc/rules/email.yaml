# Mail security gateway: what reached a user's mailbox. Mails the gateway already quarantined or rejected are handled.
rules:
  - id: MAIL-001
    type: match
    short: Phishing mail with a risky attachment
    title: Mail with a risky attachment delivered
    attack: [T1566.001]
    severity: 6
    where:
      type: email
      action: delivered
      direction: inbound
      attachments|re: ["(?i)\\.(docm|xlsm|pptm|dotm|js|jse|vbs|vbe|hta|exe|scr|lnk|iso|img|one|wsf|bat|cmd|ps1)\\b"]
    text: "Mail from {sender} ({src_ip}) with attachment {attachments} delivered to {recipient} at {first}, gateway score {score}"

  - id: MAIL-002
    type: sequence
    short: Link clicked in a phishing mail
    title: User clicked a link in a mail flagged as phishing
    attack: [T1566.002, T1204.001]
    severity: 8
    by: [user, message_id]
    within_min: 60
    steps:
      - where: {type: email, action: delivered, verdict: [suspected_phishing, phishing, malicious, malware, suspicious]}
      - where: {type: email, action: url-clicked}
    text: "{user} clicked {url} at {last} in mail {message_id}, which the gateway flagged as phishing"

  - id: MAIL-003
    type: threshold
    short: malware mail campaign stopped
    title: Malware mail campaign quarantined by the gateway
    attack: [T1566.001]
    severity: 3
    group_by: [sender]
    window_min: 60
    min_count: 5
    where: {type: email, action: quarantined, verdict: malware}
    text: "{count} malware mails from {sender} quarantined between {first} and {last}: nobody received them; check that no copy was released or forwarded"
